<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Productivity Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="container">

        <header>
            <h1>Interactive Productivity Dashboard</h1>
            <p>Web Markup and Scripting - 2026FA.WEB.115.0002</p>
        </header>

        <div class="row">

            <!-- Weekly Task Goals -->
            <div class="col" id="weekly-tasks">

                <h2>Weekly Task Goals</h2>

                <form id="weekly-goal-form">

                    <div class="form-group">
                        <label for="user-name">Name:</label>
                        <input type="text" id="user-name" name="user-name" required>
                    </div>

                    <div class="form-group">
                        <label for="daily-goal">Daily Task Goal:</label>
                        <input type="number" id="daily-goal" name="daily-goal" min="0" required>
                    </div>

                    <div class="form-group">
                        <label for="bonus-tasks">Weekly Bonus Tasks:</label>
                        <input type="number" id="bonus-tasks" name="bonus-tasks" min="0" required>
                    </div>

                    <button type="submit" id="goal-btn">Calculate Weekly Goal</button>

                </form>

                <p id="goal-message"></p>

                <script src="js/task-manager.js" defer></script>

            </div>


            <!-- Imperial/Metric Converter -->
            <div class="col" id="metric-converter">

                <h2>Imperial/Metric Converter</h2>

                <form id="metric-converter-form">

                    <div class="form-group">
                        <label for="metric-value">Value:</label>
                        <input
                            type="number"
                            id="metric-value"
                            name="metric-value"
                            step="any"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="conversion-type">Conversion Type:</label>

                        <select id="conversion-type" name="conversion-type" required>
                            <option value="">Select a conversion</option>
                            <option value="inch to centimeter">
                                Inch to Centimeter
                            </option>
                            <option value="foot to centimeter">
                                Foot to Centimeter
                            </option>
                            <option value="yard to meter">
                                Yard to Meter
                            </option>
                            <option value="mile to kilometer">
                                Mile to Kilometer
                            </option>
                            <option value="centimeter to inch">
                                Centimeter to Inch
                            </option>
                            <option value="centimeter to foot">
                                Centimeter to Foot
                            </option>
                            <option value="meter to yard">
                                Meter to Yard
                            </option>
                            <option value="kilometer to mile">
                                Kilometer to Mile
                            </option>
                        </select>
                    </div>

                    <button type="submit" id="convert-btn">
                        Convert
                    </button>

                </form>

                <p id="conversion-result"></p>

                <script src="js/metric-converter.js" defer></script>

            </div>

        </div>

    </div>

</body>
</html>
