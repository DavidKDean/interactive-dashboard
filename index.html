<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Productivity Dashboard</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="container">

        <header>
            <h1>Interactive Productivity Dashboard</h1>
            <p>Web Markup and Scripting</p>
        </header>

        <div class="row">

            <!-- Weekly Task Goals -->
            <div class="col" id="weekly-tasks">

                <h2 class="heading">Weekly Task Goals</h2>

                <form id="weekly-goal-form">

                    <label for="user-name">Name:</label>
                    <input type="text" id="user-name" name="user-name">

                    <br><br>

                    <label for="daily-goal">Daily Goal:</label>
                    <input type="number" id="daily-goal" name="daily-goal">

                    <br><br>

                    <label for="bonus-tasks">Bonus Tasks:</label>
                    <input type="number" id="bonus-tasks" name="bonus-tasks">

                    <br><br>

                    <button id="goal-btn" type="submit">Calculate Goal</button>

                </form>

                <p id="goal-message"></p>

                <!-- Weekly Task List -->
                <div id="task-list">

                    <h3>Weekly Task List</h3>

                    <p>Enter a task below to manage your goals.</p>

                    <form>
                        <label for="task-name">Enter task:</label>
                        <input type="text" id="task-name">

                        <button id="add-task" type="button">
                            Add Task
                        </button>
                    </form>

                </div>

                <script src="js/task-manager.js" defer></script>

            </div>


            <!-- Imperial/Metric Converter -->
            <div class="col" id="metric-converter">

                <h2 class="heading">Imperial/Metric Converter</h2>

                <form id="metric-converter-form">

                    <label for="metric-value">Value:</label>

                    <input
                        type="number"
                        id="metric-value"
                        name="metric-value"
                        step="any"
                        required
                    >

                    <br><br>

                    <label for="conversion-type">Conversion:</label>

                    <select id="conversion-type" name="conversion-type">

                        <option value="inch to centimeter">
                            Inch to Centimeter
                        </option>

                        <option value="foot to centimeter">
                            Foot to Centimeter
                        </option>

                        <option value="yard to meter">
                            Yard to Meter
                        </option>

                        <option value="mile to kilometer">
                            Mile to Kilometer
                        </option>

                        <option value="centimeter to inch">
                            Centimeter to Inch
                        </option>

                        <option value="centimeter to foot">
                            Centimeter to Foot
                        </option>

                        <option value="meter to yard">
                            Meter to Yard
                        </option>

                        <option value="kilometer to mile">
                            Kilometer to Mile
                        </option>

                    </select>

                    <br><br>

                    <button id="convert-btn" type="submit">
                        Convert
                    </button>

                </form>

                <p id="conversion-result"></p>

                <script src="js/metric-converter.js" defer></script>

            </div>


            <!-- Magic Eight Ball -->
            <div class="col" id="magic-eight-ball">

                <h2 class="heading">Magic Eight Ball</h2>

                <form>

                    <p>Ask the Magic Eight Ball a yes/no question:</p>

                    <input
                        id="question"
                        name="question"
                        size="80"
                    >

                    <br><br>

                    <div id="magicEightBall">

                        <div id="circle"></div>

                        <img
                            id="ball"
                            src="img/magic-eight-ball.png"
                            alt="Magic Eight Ball"
                        >

                    </div>

                    <br>

                    <button
                        id="reset"
                        name="reset"
                        type="reset"
                    >
                        Ask another question
                    </button>

                    <button
                        id="add-response"
                        type="button"
                    >
                        Add New Response
                    </button>

                    <br>

                </form>

            </div>

        </div>

    </div>

    <!-- Magic Eight Ball JavaScript -->
    <script src="js/magic-eight-ball.js" defer></script>

    <!-- Magic Eight Ball CSS -->
    <link rel="stylesheet" href="css/magic-eight-ball.css">

</body>
</html>
